<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game1</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: white;
      }
      .card {
        text-align: center;
        padding: 3rem 4rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.5rem;
      }
      p {
        margin: 0;
        font-size: 1.1rem;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Welcome to Game1</h1>
      <p>Your GitHub Pages site is live and ready.</p>
    </div>
  </body>
</html>
